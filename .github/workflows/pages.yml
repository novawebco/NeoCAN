name: Publish NeoCAN website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website-src/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: website-src
      - name: Build and check site
        working-directory: website-src
        run: |
          npm run build
          node scripts/qa.mjs
          node scripts/scope-qa.mjs
          node scripts/seo-qa.mjs
          node scripts/prepare-pages.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website-src/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
